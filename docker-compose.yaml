# version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ndse-delivery-backend:latest
    container_name: ndse-delivery-backend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT-3000}:${HTTP_PORT-3000}"
    environment:
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=${HTTP_PORT-3000}
      - MONGO_URL=mongodb://mongo:27017/ndse_delivery
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - mongo
    volumes:
      - ./uploads:/usr/src/app/uploads

  mongo:
    image: mongo:6.0
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"

volumes:
  mongo_data:
